name: Build iOS development app
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app_name:
        description: Installed app name
        required: false
        default: AndroidEmu
        type: string
      bundle_id:
        description: iOS bundle identifier
        required: false
        default: org.androidemu.app
        type: string
      icon_url:
        description: Optional HTTPS PNG/JPEG app icon URL (1024px or larger)
        required: false
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build portable components with sanitizers
        run: |
          cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Debug -DEMU_SANITIZE=ON
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure
      - name: Build and exercise real GLES renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgles1 libgles2 libgl1-mesa-dri libx11-dev
          cmake -S ThirdParty/EmuGL -B build/emugl-host -DEMUGL_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/emugl-host --parallel 2
          ctest --test-dir build/emugl-host --output-on-failure
      - name: Verify tooling
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
  goldfish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config python3-venv libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev zlib1g-dev
      - name: Fetch pinned QEMU source
        run: python3 scripts/fetch_references.py --only qemu
      - name: Build Goldfish-only ARM emulator
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build_qemu_host.sh 2>&1 | tee qemu-build.log
      - name: Exercise actual MMIO and TCG boot path without Android images
        run: |
          MESON="$PWD/build/qemu-host/pyvenv/bin/meson" python3 -m unittest discover -s Tests -p 'test_cross_build.py' -v
          python3 Tests/QEMU/test_goldfish.py
          python3 Tests/QEMU/test_embedded.py
      - name: Restore HIGHMEM kernel and test compiler
        id: highmem-cache
        uses: actions/cache@v4
        with:
          key: goldfish-highmem-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_highmem_kernel.py') }}
          path: |
            build/guest-kernel
            build/highmem/toolchain
      - name: Build pinned ARMv7 HIGHMEM kernel
        if: steps.highmem-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build_highmem_kernel.py
      - name: Boot HIGHMEM kernel and test real userspace memory
        run: python3 Tests/QEMU/test_highmem_kernel.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goldfish-highmem-kernel
          path: build/guest-kernel/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: goldfish-build-diagnostics
          path: qemu-build.log
          if-no-files-found: ignore
  ios:
    runs-on: macos-15
    needs: [native, goldfish]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@v8
        with:
          name: goldfish-highmem-kernel
          path: build/guest-kernel
      - name: Select an installed stable Xcode with iOS 26 SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/select_xcode.py >> "$GITHUB_ENV"
      - name: Swift model tests
        run: bash scripts/test_models.sh
      - name: Install cross-build tools
        run: |
          brew install meson ninja pkg-config gettext glib autoconf automake libtool e2fsprogs
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          python3 -m venv build/tools-venv
          build/tools-venv/bin/pip install setuptools six pyparsing pyyaml distlib mako
          echo "$PWD/build/tools-venv/bin" >> "$GITHUB_PATH"
      - name: Compute iOS dependency cache key
        id: dependency-key
        run: echo "key=$(python3 scripts/ios_dependency_key.py)" >> "$GITHUB_OUTPUT"
      - name: Restore compiled iOS dependencies and corresponding sources
        id: dependencies-cache
        uses: actions/cache/restore@v4
        with:
          key: ios-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-key.outputs.key }}
          path: |
            build/ios-dependencies/sysroot-iOS-arm64
            build/ios-dependencies/dependency-key
            build/ios-dependencies/build-iOS-arm64
            !build/ios-dependencies/build-iOS-arm64/**/.git
            !build/ios-dependencies/build-iOS-arm64/**/utm_build
            !build/ios-dependencies/build-iOS-arm64/**/ANGLE.xcarchive
      - name: Compile arm64 iOS core and Goldfish engine
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build_dependencies.sh 2>&1 | tee build-dependencies.log
      - name: Save completed dependencies even if the engine compile failed
        if: ${{ !cancelled() && steps.dependencies-cache.outputs.cache-hit != 'true' && hashFiles('build/ios-dependencies/dependency-key') != '' }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.dependencies-cache.outputs.cache-primary-key }}
          path: |
            build/ios-dependencies/sysroot-iOS-arm64
            build/ios-dependencies/dependency-key
            build/ios-dependencies/build-iOS-arm64
            !build/ios-dependencies/build-iOS-arm64/**/.git
            !build/ios-dependencies/build-iOS-arm64/**/utm_build
            !build/ios-dependencies/build-iOS-arm64/**/ANGLE.xcarchive
      - name: Configure app identity
        env:
          APP_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.app_name || 'AndroidEmu' }}
          APP_BUNDLE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_id || 'org.androidemu.app' }}
          APP_ICON_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.icon_url || '' }}
        run: |
          python3 scripts/configure_app_build.py \
            --name "$APP_NAME" \
            --bundle-id "$APP_BUNDLE_ID" \
            --icon-url "$APP_ICON_URL"
      - name: Build unsigned iPhoneOS application
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build_ios.sh 2>&1 | tee build-ios.log
      - name: Package development IPA
        run: bash scripts/package_unsigned_ipa.sh
      - name: Collect corresponding project source
        run: |
          git archive --format=tar.gz --output=build/artifacts/AndroidEmu-source.tar.gz HEAD
          python3 scripts/collect_engine_source.py
          cp build/guest-kernel/goldfish-kernel-source.tar.gz build/guest-kernel/goldfish-highmem.config build/guest-kernel/goldfish-kernel-build.txt build/artifacts/
          if [[ -f build/app-customization.json ]]; then cp build/app-customization.json build/artifacts/; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: AndroidEmu-development-unsigned
          path: build/artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: build-diagnostics
          path: |
            build-ios.log
            build-dependencies.log
            build/qemu-ios/config.log
            build/qemu-ios/config-meson.*
            build/qemu-ios/meson-logs/
            build/ios-dependencies/**/config.log
            build/ios-dependencies/**/meson-logs/
            build/DerivedData/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: ignore
